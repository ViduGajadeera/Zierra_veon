# ==============================================================================
# Nginx Hardening Configuration for Zierra Veon (/var/www/zierra-veon)
# Place these directives inside your /etc/nginx/sites-available/default (or zierra-veon)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name zierraveon.com www.zierraveon.com;

    # Force HTTPS Redirect
    return 301 https://zierraveon.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zierraveon.com www.zierraveon.com;

    root /var/www/zierra-veon;
    index index.html;

    # 1. Canonical Redirect www to non-www
    if ($host = 'www.zierraveon.com') {
        return 301 https://zierraveon.com$request_uri;
    }

    # 2. SSL Configuration (Managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/zierraveon.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zierraveon.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 3. Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google.com https://*.googleusercontent.com; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; frame-src 'self' https://www.google.com https://maps.google.com;" always;

    # 4. Hide Nginx Version
    server_tokens off;

    # 5. Clean / Extensionless URLs (e.g. /services -> services.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 6. BLOCK .git, .env, .htaccess, and all hidden dotfiles (CRITICAL: SEC-01)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 7. Block access to internal markdown/docs & backup files (SEC-05)
    location ~* \.(md|sql|bak|backup|old|orig|pdf)$ {
        # Allow PDF if you want users to download the price list PDF directly;
        # otherwise deny to prevent exposure of internal source docs.
        deny all;
        return 404;
    }

    # 8. Cache static assets with proper caching headers
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
